#
# ScaRF-SLAM demo, SLAM host side. See README.md.
#
# Receives the SBS stereo video track stereo_camera and republishes it as
# sensor_msgs/CompressedImage on /stereo_camera. Video tracks
# match by exact name, so this entry is not a regex.
#
# Sends the visualization topics of the SLAM host to the room as data tracks.
# The names are literal, because a regex such as /rtabmap/.* also matches the
# large internal topics, for example /rtabmap/mapData.
#
# No video: the camera view is the robot's stereo_camera track, which is
# already in the room. Video from this host, such as the rectified pair or
# /scarf_slam/images (about 5 Mbps together), made the data tracks lose a
# third of their messages while a viewer watched it.

$schema: https://raw.githubusercontent.com/livekit/ros-portal/main/src/ros_portal_config/schema/ros_portal_config.schema.json

ros_portal:
  version: "0.0.1"
  ros_threads: 4

  topics:
    - topic: "/stereo_camera"
      direction: "in"

    # Transforms: map -> odom -> stereo_link from RTAB-Map, and the camera
    # frames from the launch file.
    - topic: "/tf"
      direction: "out"

    - topic: "/tf_static"
      direction: "out"
      latched: true

    # Every data track adds traffic that can make the map chunks lose
    # messages, so only what the viewer shows goes out. These stay local:
    # - /stereo/*/camera_info: calibrations of the rectified pair, whose
    #   images stay local too.
    # - /rtabmap/odom: the same pose as /tf.
    # - /rtabmap/odom_last_frame (15 KB PointCloud2 at 5 Hz) and
    #   /rtabmap/odom_local_map (64 KB at 1 Hz), the feature clouds of
    #   odometry.
    # - /scarf_slam/slam_poses_prev: only filled in multi-session mapping.

    # Loop-corrected trajectory.
    - topic: "/rtabmap/mapPath"
      direction: "out"

    # The occupancy grid grows with the run, so it is sent at a low rate.
    # /rtabmap/cloud_map stays local: it reaches 2.6 MB (median) to 4.5 MB per
    # message, which an unreliable DataTrack almost never delivers whole, and
    # while it is sent the messages of the other data tracks are lost (see
    # paced_sender.py). The ScaRF-SLAM chunks below carry the map instead.
    - topic: "/rtabmap/map"
      direction: "out"
      max_rate_hz: 0.5

    # Map creation: ScaRF-SLAM output. The publish_ros2_* keys of
    # config/scarf_slam/cobra_stereo.yaml turn these topics on. The map goes
    # out as voxelized Draco chunks of the submaps, one
    # foxglove_msgs/CompressedPointCloud topic per chunk and at most 32 KB per
    # message, because DataTracks are not reliable (see submap_cloud.py). The
    # chunk topics appear while ScaRF-SLAM maps, so this entry is a regex.
    # The PointCloud2 /scarf_slam/clouds of the whole map stays local (RViz).
    - topic: "/scarf_slam/submaps/.*"
      direction: "out"

    - topic: "/scarf_slam/slam_poses"
      direction: "out"
